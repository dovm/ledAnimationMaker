<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Animation Editor</title>
    <link href="bootstrap-5.3.6-dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="fa.min.css" rel="stylesheet">
    <!-- <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">-->
    <style>
        body {
            display: flex;
            overflow: hidden;
            flex-direction: column;
            height: 100vh;
        }

        .tab_container {
            background-color: #f0f0f0;
            transition: margin-left 0.3s;
            
        }

        .right-sidebar{
            margin-left: 5px;
            padding: 5px;
            border-left: 1px solid black;
            flex-shrink: 0;
        }

        .sidebar {
            width: 250px;
            padding: 5px;
            border-right: 1px solid black;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .sidebar.collapsed {
            padding: 0px;
            width: 0;
            overflow: hidden;
            border-right: 0px solid black;
        }

        .close-sidebar {
            width: 0px;
            overflow: hidden;
            
        }

        .close-sidebar.collapsed {
            width: fit-content;
            padding: 5px;
            border-right: 1px solid black;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .toolbar {
            align-items: center;
            gap: 10px;
            margin-left: 5px;
            background-color: #f0f0f0;
        }

        #toolbar label {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        .canvas-container {
            border: 1px solid black;
            display: block;
            margin-left: 5px;
            justify-content: left;
            align-items: center;
            flex-grow: 1;
            overflow: auto;
            box-sizing: border-box;
        }

        #timeline-toolbar {
            background-color: #f0f0f0;
            border-bottom: 1px solid black;
            display: block;
            align-items: center;
            padding: 10px;
            min-height: 120px;
        }

        .effect-control {
            margin: 5px 0;
        }

        .timeline {
            position: relative;
            padding-left: 50px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .frame-thumbnail {
            position: relative;
            display: inline-block;
            width: 60px;
            /* only a small part shown */
            height: 60px;
            margin-left: -50px;
            /* overlap */
            background-color: #ddd;
            overflow: hidden;
            vertical-align: top;
            border-bottom-left-radius: 5px;
            border-top-left-radius: 5px;
            border: 2px solid black;
            z-index: 1;
        }

        .frame-thumbnail:hover {
            margin-right: 48px;
        }

        .frame-thumbnail:hover canvas {
            transform: translateX(0);
            z-index: 10;
        }

        .timeline-wrapper {
            display: flex;
            gap: 0;
        }

        .frame-thumbnail-current {
            border: 2px solid red;
            padding: 0px;
        }

        #led-group-list {
            overflow-y: auto;
        }

        .selected-item {
            background-color: aquamarine;
        }

        .list-item-label {
            align-content: center;
            margin-left: 5px;
        }

        .multiple-input-box {
            border: 1px solid black;
            padding: 3px;
        }

        .select-input {
            margin: 2px;
            width: 100px;
        }

        .box-wrapper {
            position: relative;
            margin-top: 1rem;
            padding: 12px;
            padding-top: 16px;
            outline: 1px solid #444;
            outline-offset: -0.4em;
            font-weight: bold;
            color: #444;
        }

        .box-label {
            position: absolute;
            top: -0.4em;
            left: 1rem;
            background: #f0f0f0;
            padding: 0 0.5em;
            font-weight: bold;
            color: #444;
        }

        .button-icon-with-text {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .hidden-input {
            display: none;
        }

        .icon-img {
            width: 24px;
            height: 24px;
            margin: 1px;
        }

        .pressed-icon {
            display: none;
        }

        /* Show pressed icon on click/press */
        .icon-label:active .default-icon {
            display: none;
        }

        .icon-label:active .pressed-icon {
            display: inline;
        }

        .canvas-default-size {
            display: block;
            
        }
        
    </style>
</head>

<body>
    <div class="container-fluid h-100 d-flex flex-column">
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="layout-tab" data-bs-toggle="tab" data-bs-target="#layout"
                    type="button" role="tab">Layout</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="animation-tab" data-bs-toggle="tab" data-bs-target="#animation"
                    type="button" role="tab">Animation</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="effects-tab" data-bs-toggle="tab" data-bs-target="#effects" type="button"
                    role="tab">Effects</button>
            </li>
        </ul>

        <div class="h-100 bg-light tab-content flex-grow-1 overflow-hidden" id="myTabContent">
            <div class="h-100 tab-pane fade show active border border-top-0 rounded-bottom" id="layout" role="tabpanel">
                <div class="h-100 d-flex flex-column tab_container">
                    
                    <div class="h-100 overflow-auto d-flex ">
                        <div id="layout-sidebar" class="sidebar d-flex flex-column">
                            <button type="button" class="btn btn-default" style="width: fit-content" onclick="toggleLayoutSidebar()">
                                <span class="fa-solid fa-xmark"></span>
                            </button>
                            <div class="box-wrapper">
                                <span class="box-label">File Operations</span>
                                <div class="input-group">
                                    <input type="file" class="form-control" onclick="loadLedsConfig(event)">
                                    </input>
                                    <button type="button" class="btn btn-default" onclick="saveLedsConfig()">
                                        <span class="fa-solid fa-save"></span>
                                    </button>
                                </div>
                            </div>
                            <div class="box-wrapper">
                            <span class="box-label">LED Strip Settings</span>
                            <span class="form-label">Layout size:</span>
                            <div class="input-group d-flex align-items-center">
                                <input type="number" id="canvasWidth" onchange="canvasDImChange()" class="form-control"
                                    min="1" max="5000" value="500">
                                <span class="input-group-addon">X</span>
                                <input type="number" id="canvasHeight" onchange="canvasDImChange()" class="form-control"
                                    min="1" max="5000" value="500">
                            </div>
                            <span>Add LEDs:</span>
                            <div class="input-group">
                                <input type="number" id="ledCount" placeholder="Number of LEDS...   " class="form-control" min="1" max="100">
                                <span class="input-group-btn">
                                    <button type="button" class="btn btn-default" onclick="addLedStrip()">
                                        <span class="fa-solid fa-plus"></span>
                                    </button>
                                </span>
                              </div>
                            
                            
                            </div>
                        </div>
                        <div id="layout-close-sidebar" class="close-sidebar">
                            <button type="button" class="btn btn-default" onclick="toggleLayoutSidebar()">
                                <span class="fa-solid fa-angle-right"></span>
                            </button>
                        </div>
                        <div class="overflow-auto d-flex flex-grow-1 pt-1">
                            <div class="toolbar">
                            <div class="btn-toolbar" role="toolbar">
                                <div class="d-flex flex-column align-items-start gap-2" style="width: 45px;">
                                    <button type="button" class="btn btn-default" onclick="move_tool()">
                                        <span class="fa-solid fa-up-down-left-right"></span>
                                    </button>
                                    <button type="button" class="btn btn-default" onclick="select_tool()">
                                        <span class="fa-solid fa-object-group"></span>
                                    </button>
                                    <button class="btn btn-default" type="button" onclick="rotateTool()">
                                        <span class="fa-solid fa-rotate"></span>
                                    </button>
                                    <input type="number" id="rotate_angle" class="form-control"
                                        min="0" max="360" value="90">
                                    <button type="button" class="btn btn-default" onclick="erase_tool()">
                                        <span class="fa-solid fa-eraser"></span>
                                    </button>
                                    <button type="button" class="btn btn-default" onclick="draw_tool()">
                                        <span class="fa-solid fa-pencil"></span>
                                    </button>
                                    <button type="button" class="btn btn-default" onclick="insertSelectedLeds()">
                                        <span class="fa-solid fa-scissors"></span>
                                    </button>
                                    <button type="button" class="btn btn-default"
                                        onclick="duplicateSelectedLeds()">
                                        <span class="fa-solid fa-clone"></span>
                                    </button>
                                    <button type="button" class="btn btn-default" onclick="deleteSelectedLeds()">
                                        <span class="fa-solid fa-trash"></span>
                                    </button>
                                    <button type="button" class="btn btn-default" onclick="toggleSelectedLeds()">
                                        <span class="fa-solid fa-toggle-off"></span>
                                    </button>
                                    <button type="button" class="btn btn-default" onclick="undo()">
                                        <span class="fa-solid fa-undo"></span>
                                    </button>
                                    <button type="button" class="btn btn-default" onclick="redo()">
                                        <span class="fa-solid fa-redo"></span>
                                    </button>
                                </div>     
                            </div>
                            </div>
                            <div class="h-100 canvas-container">
                            <canvas id="ledCanvasLayout" class="canvas-default-size"></canvas>
                            </div>
                        </div>
                        
                    </div>
                    <div style="min-height: 120px;"></div>
                </div>
            </div>
            <div class="h-100 tab-pane fade  border border-top-0 rounded-bottom" id="animation" role="tabpanel">
                <div class="h-100 d-flex flex-column tab_container">
                    <div class="h-100 overflow-auto d-flex ">
                        <div id="animation-sidebar" class="sidebar d-flex flex-column">
                            <button type="button" class="btn btn-default" style="width: fit-content;" onclick="toggleAnimationSidebar()">
                                <span class="fa-solid fa-xmark"></span>
                            </button>
                            <div class="h-100 box-wrapper overflow-auto d-flex flex-column">
                                <span class="box-label">Animation Controls</span>
                                <div class="btn-toolbar" role="toolbar">
                                    <div class="btn-group" role="group">
                                        <button type="button" class="btn btn-default" onclick="createAnimation()">
                                            <span class="fa-solid fa-file-circle-plus"></span>
                                        </button>
                                        <button type="button" class="btn btn-default" onclick="deleteAnimation()">
                                            <span class="fa-solid fa-trash"></span>
                                        </button>
                                        <button type="button" class="btn btn-default" onclick="loadAnimationFromFile()">
                                            <span class="fa-solid fa-folder-open"></span>
                                        </button>
                                        <button type="button" class="btn btn-default" onclick="saveAnimationToFile()">
                                            <span class="fa-solid fa-save"></span>
                                        </button>
                                    </div>
                                </div>
                                <div class="effect-control">
                                    <input class="form-control" type="text" id="animName" placeholder="Animation name...">
                                </div>
                                <ul id="animation-list" class="list-group overflow-y-auto">
                                </ul>
                            </div>
                        </div>
                        <div id="animation-close-sidebar" class="close-sidebar">
                            <button type="button" class="btn btn-default" onclick="toggleAnimationSidebar()">
                                <span class="fa-solid fa-angle-right"></span>
                            </button>
                        </div>
                        <div class="overflow-auto d-flex flex-grow-1 pt-1">
                            <div class="toolbar">
                                <div class="btn-toolbar" role="toolbar">
                                    <div class="d-flex flex-column align-items-start gap-2" style="width: 45px;">
                                        <button type="button" class="btn btn-default" onclick="paintSelected()">
                                            <span class="fa-solid fa-fill-drip"></span>
                                        </button>
                                        <button type="button" class="btn btn-default" onclick="paint_tool()">
                                            <span class="fa-solid fa-brush"></span>
                                        </button>
                                        <button type="button" class="btn btn-default" onclick="select_tool()">
                                            <span class="fa-solid fa-object-group"></span>
                                        </button>
                                        <input style="width: 40px;" class="form-control form-control-color" type="color"
                                            id="brushColor" value="#ff0000">
                                        <button type="button" class="btn btn-default" onclick="undo()">
                                            <span class="fa-solid fa-undo"></span>
                                        </button>
                                        <button type="button" class="btn btn-default" onclick="redo()">
                                            <span class="fa-solid fa-redo"></span>
                                        </button>
                                    </div>
                                </div>

                            </div>
                            <div class="h-100 canvas-container">
                                <canvas id="ledCanvasAnimation" class="canvas-default-size"></canvas>
                            </div>

                        </div>
                        <div id="right-side-bar" class="right-sidebar">
                            <div class="box-wrapper">
                                <span class="box-label">Group Animation</span>
                                <div class="effect-control">
                                    <input type="number" class="form-control" placeholder="number of frames" id="framesCount" min="1" max="60">
                                </div>
                                <span>Color range:</span>
                                <div class="effect-control input-group">
                                    <input class="form-control form-control-color" type="color" id="startColor" value="#ff0000">
                                    <input class="form-control form-control-color" type="color" id="endColor" value="#0000ff">
                                </div>
                                <div class="d-flex align-items-center" role="group">
                                    <span for="options" class="form-label mb-0">Effect:</span>
                                        <select  class="select-input form-select w-auto">
                                            <option value="rainbow">Rainbow</option>
                                            <option value="fade">Fade</option>
                                            <option value="random">Random</option>
                                        </select>
                                    <button type="button" class="btn btn-default" onclick="createAnimationOnGroup()">
                                        <span class="fa-solid fa-play"></span>
                                    </button>
                                </div>
                            </div>
                            <div class="box-wrapper h-100 overflow-auto d-flex flex-column">
                                <span class="box-label">LED Groups</span>
                                <div class="btn-group">
                                    <button type="button" class="btn btn-default" onclick="addGroup()">
                                        <span class="fa-solid fa-object-group"></span>
                                    </button>
                                    <button type="button" class="btn btn-default" onclick="clearGroups()">
                                        <span class="fa-solid fa-trash"></span>
                                    </button>
                                </div>
                                <ul id="led-group-list" class="list-group ">
                                </ul>
        
                            </div>
                            
                            
                        </div>
                    </div>
                    <div id="timeline-toolbar">
                        <div class="btn-toolbar" role="toolbar">
                            <div class="btn-group" role="group">
                                <button type="button" class="btn btn-default" onclick="prevFrame()">
                                    <span class="fa-solid fa-chevron-left"></span>
                                </button>
                                <button type="button" class="btn btn-default" onclick="nextFrame()">
                                    <span class="fa-solid fa-chevron-right"></span>
                                </button>
                                <button type="button" class="btn btn-default" onclick="addFrame()">
                                    <span class="fa-solid fa-plus"></span>
                                </button>
                                <button type="button" class="btn btn-default" onclick="deleteFrame()">
                                    <span class="fa-solid fa-remove"></span>
                                </button>
                                <button type="button" class="btn btn-default" onclick="duplicateFrame()">
                                    <span class="fa-solid fa-clone"></span>
                                </button>
                                <button type="button" class="btn btn-default" onclick="playAnimation()">
                                    <span class="fa-solid fa-play"></span>
                                </button>
                                <button type="button" class="btn btn-default" onclick="exportAnimation()">
                                    <span class="fa-solid fa-file-export"></span>
                                </button>
                            </div>
                        </div>
                        <div class="timeline">
                            <div id="frame-thumbnails" class="timeline-wrapper">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="tab-pane fade  border border-top-0 rounded-bottom" id="effects" role="tabpanel">

            </div>
        </div>









        <script src="bootstrap-5.3.6-dist/js/bootstrap.bundle.min.js"></script>
        <script src="led_common.js"></script>
        <script src="audio_modulator.js"></script>
        <script src="led_editor.js"></script>

</body>

</html>
