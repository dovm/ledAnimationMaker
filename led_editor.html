<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Animation Editor</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #container { display: flex; flex: 1; background-color: #f0f0f0; }
        #sidebar { width: 250px; padding: 10px; border-right: 1px solid black; }
        #toolbar {
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    padding: 10px;
                    background-color: #f0f0f0;
                    border-bottom: 1px solid #ddd;
        }

        #toolbar label {
                    display: flex;
                    align-items: center;
                    gap: 5px;
        }

        #toolbar input[type="number"],
        #toolbar input[type="color"] {
            width: 60px;
            height: 24px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

                
        #canvas-container { flex: 1; overflow: auto; display: block; margin-left: 5px; justify-content: left; align-items: center; }
        canvas { border: 1px solid black; cursor: crosshair; }
        #timeline { background-color: #f0f0f0; min-height: 100px; border-bottom: 1px solid black; display: block; align-items: center; padding: 10px; overflow-x: auto; }
        .effect-control { margin: 5px 0; }
        .frame-thumbnail { width: 82px; height: 42px; padding: 1px; border: 1px solid black; margin: 5px; display: inline-block; cursor: pointer; }
        .frame-thumbnail-current{ border: 2px solid red; }
        #led-group-list { overflow-y: auto; max-height: 300px;}    
        .led-group-item { 
            border: 1px solid #444; 
            border-radius: 4px; 
            padding: 3px; 
            display: flex;  
            margin: 5px 0; 
        }
        .animation-item { 
            border: 1px solid #444; 
            border-radius: 4px; 
            padding: 3px; 
            display: flex; 
            margin: 5px 0; 
        }
        .selected-item {
            border: 2px solid blue;
        }

        .list-item-label {
            align-content: center; 
            margin-left: 5px;
        }
        .multiple-input-box {
            border: 1px solid black; 
            padding: 3px;
        }
        .select-input {
            margin: 2px;
            width: 100px;
        }
        .box-wrapper {
            position: relative;
            margin: 5px;
            margin-top: 1rem;
            padding: 8px;
            border: 1px solid #444;
            border-radius: 4px;
            font-weight: bold;
            color: #444;
        }
        .box-label {
            position: absolute;
            top: -0.8em;
            left: 1rem;
            background: #f0f0f0;
            padding: 0 0.5em;
            font-weight: bold;
            color: #444;
        }
        .button-icon-with-text {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .hidden-input {
          display: none;
        }

        .icon-img {
            width: 24px;
            height: 24px;
            margin: 1px;
        }

        .pressed-icon {
            display: none;
        }

        /* Show pressed icon on click/press */
        .icon-label:active .default-icon {
            display: none;
        }

        .icon-label:active .pressed-icon {
            display: inline;
        }

    </style>
</head>
<body>
    <div id="timeline">
        <label class="icon-label" for="prev-frame">
            <img src="icons/chevron-left-circle-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
            <img src="icons/chevron-left-circle-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
        </label>
        <button onclick="prevFrame()" id="prev-frame" class="hidden-input"></button>
        <label class="icon-label" for="next-frame">
            <img src="icons/chevron-right-circle-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
            <img src="icons/chevron-right-circle-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
        </label>
        <button onclick="nextFrame()" id="next-frame" class="hidden-input"></button>
        <label class="icon-label" for="add-frame">
            <img src="icons/plus-circle-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
            <img src="icons/plus-circle-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
        </label>
        <button onclick="addFrame()" id="add-frame" class="hidden-input"></button>
        <label class="icon-label" for="del-frame">
            <img src="icons/trash-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
            <img src="icons/trash-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
        </label>
        <button onclick="deleteFrame()" id="del-frame" class="hidden-input"></button>
        <label class="icon-label" for="dup-frame">
            <img src="icons/duplicate-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
            <img src="icons/duplicate-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
        </label>
        <button onclick="duplicateFrame()" id="dup-frame" class="hidden-input"></button>
        <label class="icon-label" for="play-animation">
            <img src="icons/play-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
            <img src="icons/play-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
        </label>
        <button onclick="playAnimation()" id="play-animation" class="hidden-input"></button>
        <label class="icon-label" for="export-animation">
            <img src="icons/save-floppy-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
            <img src="icons/save-floppy-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
        </label>
        <button onclick="exportAnimation()" id="export-animation" class="hidden-input"></button>
        <div id="frame-thumbnails"></div>
    </div>
    <div id="container">
        
        <div id="sidebar">
            <div class="box-wrapper">
                <span class="box-label">File Operations</span>
                <div>
                    <label class="icon-label">
                        <input type="file" class="hidden-input" accept=".json" onchange="loadLedsConfig(event)">
                        <img src="icons/upload-svgrepo-com.svg" alt="Upload" class="icon-img default-icon" />
                        <img src="icons/upload-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                    </label>
                    <label class="icon-label" onclick="saveLedsConfig()">
                        <img src="icons/save-floppy-svgrepo-com.svg" alt="Save" class="icon-img default-icon" />
                        <img src="icons/save-floppy-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                    </label>
                </div>
            </div>
            <div class="box-wrapper">
                <span class="box-label">LED Strip Settings</span>
                    <label class="icon-label" onclick="addLedStrip()">
                        <img src="icons/plus-circle-svgrepo-com.svg" alt="Add" class="icon-img default-icon" />
                    <img src="icons/plus-circle-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                    <span class="list-item-label">Add LED Strip</span>
                </label>
                <br>
                <label>LED Count: 
                    <input type="number" id="ledCount" class="select-input" min="1" max="100" value="20">
                </label>
            <label class="icon-label" onclick="deleteLeds()">
                <img src="icons/trash-svgrepo-com.svg" alt="Delete" class="icon-img default-icon" />
                <img src="icons/trash-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                <span class="list-item-label">Delete Selected LEDs</span>
            </label>
            </div>
            <div class="box-wrapper">
                <span class="box-label">LED Groups</span>
                    <label class="icon-label" onclick="addGroup()">
                        <img src="icons/plus-circle-svgrepo-com.svg" alt="Add" class="icon-img default-icon" />
                        <img src="icons/plus-circle-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                    </label>
                    <label class="icon-label" onclick="clearGroups()">
                        <img src="icons/trash-svgrepo-com.svg" alt="Clear" class="icon-img default-icon" />
                        <img src="icons/trash-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                    </label>
                <div id="led-group-list"></div>
            </div>
        </div>
        <div id="canvas-container">
            <style>
                
            </style>
            <div id = toolbar>
                <label>Rate: <input type="number" id="frameRate" min="1" max="60" value="30"></label>
                <label>Color: <input type="color" id="brushColor" value="#ff0000"></label>
                
                <label class="icon-label" for="move-tool">
                    <img src="icons/move-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                    <img src="icons/move-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                </label>
                <button onclick="move_tool()" id="move-tool" class="hidden-input"></button>
                <label class="icon-label" for="rotate-tool">
                    <img src="icons/rotate-right-fill-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                    <img src="icons/rotate-right-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                </label>
                <button onclick="rotateTool()" id="rotate-tool" class="hidden-input"></button>
                <label>Angle: <input type="number" id="rotate_angle" min="0" max="360" value="90"></label>
                <label class="icon-label" for="paint-selected">
                    <img src="icons/paint-bucket-color-colour-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                    <img src="icons/paint-bucket-color-colour-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                </label>
                <button onclick="paintSelected()" id="paint-selected" class="hidden-input"></button>
                <label class="icon-label" for="toggle-leds">
                    <img src="icons/toggle-on-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                    <img src="icons/toggle-on-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                </label>
                <button onclick="toggleSelectedLeds()" id="toggle-leds" class="hidden-input"></button>
                <label class="icon-label" for="select-tool">
                    <img src="icons/selection-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                    <img src="icons/selection-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                </label>
                <button onclick="select_tool()" id="select-tool" class="hidden-input"></button>
                <label class="icon-label" for="paint-tool">
                    <img src="icons/brush-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                    <img src="icons/brush-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                </label>
                <button onclick="paint_tool()" id="paint-tool" class="hidden-input"></button>
                <label class="icon-label" for="erase-tool">
                    <img src="icons/erase-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                    <img src="icons/erase-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                </label>
                <button onclick="erase_tool()" id="erase-tool" class="hidden-input"></button>
                <label class="icon-label" for="draw-tool">
                    <img src="icons/draw-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                    <img src="icons/draw-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                </label>
                <button onclick="draw_tool()" id="draw-tool" class="hidden-input"></button>
                <label class="icon-label" for="insert-selected">
                    <img src="icons/cut-circle-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                    <img src="icons/cut-circle-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                </label>
                <button onclick="insertSelectedLeds()" id="insert-selected" class="hidden-input"></button>
                
                <label class="icon-label" for="duplicate-selected">
                    <img src="icons/duplicate-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                    <img src="icons/duplicate-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                </label>
                <button onclick="duplicateSelectedLeds()" id="duplicate-selected" class="hidden-input"></button>
                
                <label class="icon-label" for="delete-selected">
                    <img src="icons/trash-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                    <img src="icons/trash-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                </label>
                <button onclick="deleteSelectedLeds()" id="delete-selected" class="hidden-input"></button>
                
            </div>
            
            <div>
                <canvas id="ledCanvas" width="800" height="600"></canvas>
            </div>
        </div>
        <div>
            <div class="box-wrapper">
                <span class="box-label">Group Animation</span>
                <div class="effect-control">
                    <label>Frames: <input type="number" id="framesCount" min="1" max="60" value="10"></label>
                </div>
                <div class="effect-control">
                    <label>Start Color: <input type="color" id="startColor" value="#ff0000"></label>
                </div>
                <div class="effect-control">
                    <label>End Color: <input type="color" id="endColor" value="#0000ff"></label>
                </div>
                <div class="effect-control">
                    <label>Effect: 
                        <select id="colorScheme" class="select-input">
                            <option value="rainbow">Rainbow</option>
                            <option value="fade">Fade</option>
                            <option value="random">Random</option>
                        </select>
                    </label>
                </div>
                <div class="effect-control">
                    <label class="icon-label" for="apply-animation">
                        <img src="icons/play-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                        <img src="icons/play-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                    </label>
                    <button onclick="createAnimationOnGroup()" id="apply-animation" class="hidden-input"></button>
                </div>
            </div>
            <div class="box-wrapper">
                <span class="box-label">Animation Controls</span>
                <div class="button-icon-with-text">
                    <label class="icon-label" for="create-animation">
                        <img src="icons/plus-circle-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                        <img src="icons/play-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                    </label>
                    <button onclick="createAnimation()" id="create-animation" class="hidden-input"></button>
                    <label class="button-icon-with-text-label">Create Animation</label>
                </div>
                <div class="button-icon-with-text">
                    <label class="icon-label" for="del-animation">
                        <img src="icons/trash-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                        <img src="icons/trash-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                    </label>
                    <button onclick="deleteAnimation()" id="del-animation" class="hidden-input"></button>
                    <label class="button-icon-with-text-label">Delete Animation</label>
                </div>
                <div class="button-icon-with-text">
                    <label class="icon-label" for="load-animation">
                        <img src="icons/plus-circle-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                        <img src="icons/plus-circle-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                    </label>
                    <input type="file" id="load-animation" accept=".json" onchange="loadAnimationFromFile(event)" class="hidden-input" />
                    <label class="button-icon-with-text-label">Load Animation</label>
                </div>
                <div class="button-icon-with-text">
                    <label class="icon-label" for="save-animation">
                        <img src="icons/save-floppy-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                        <img src="icons/save-floppy-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                    </label>
                    <button onclick="saveAnimationToFile()" id="save-animation" class="hidden-input"></button>
                    <label class="button-icon-with-text-label">Save Animation</label>
                </div>
                <div class="effect-control">
                    <label>Name: <input type="text" id="animName"></label>
                </div>
            </div>
            <div id="animation-list"></div>
        </div>
    </div>

    <script src="led_common.js"></script>
    <script src="audio_modulator.js"></script>
    <script src="led_editor.js"></script>
   
</body>
</html>
