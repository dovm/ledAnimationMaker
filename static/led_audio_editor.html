<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Animation Editor</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #container { display: flex; flex: 1; }
        #sidebar { width: 250px; overflow-y: auto; padding: 10px; border-right: 1px solid black; }
        #audio-toolbar { width: 350px; overflow-y: auto; padding: 10px; border-left: 1px solid black;}
        #canvas-container { flex: 1; overflow: auto; display: block; margin-left: 5px; justify-content: left; align-items: center; }
        canvas { border: 1px solid black; cursor: crosshair; }
        .spectrum_axis{border: 0px;}
        #timeline { min-height: 100px; border-bottom: 1px solid black; display: block; align-items: center; padding: 10px; overflow-x: auto; }
        .effect-control { margin: 5px 0; }
        .led-group-item { border: 1px solid #444; border-radius: 4px; padding: 3px; display: flex;  margin: 5px 0; }
        .animation-item { border: 1px solid #444; border-radius: 4px; padding: 3px; display: flex; margin: 5px 0; }
        .effect-item { border: 1px solid #444; border-radius: 4px; padding: 3px; display: flex; margin: 5px 0; }
        .list-item-label {align-content: center; margin-left: 5px;}
        .selected-item { border: 2px solid blue;}
        .frame-thumbnail { width: 50px; height: 50px; border: 1px solid black; margin: 5px; display: inline-block; cursor: pointer; }
        .frame-thumbnail-current{ border: 2px solid red; }

        .multiple-input-box{border: 1px solid black; padding: 3px;}

        .select-input{
            margin: 2px;
            width: 100px;
        }

        .box-wrapper {
              position: relative;
              margin: 5px;
              margin-top: 1rem;
              padding: 8px;
              border: 1px solid #444;
              border-radius: 4px;
              font-weight: bold;
              color: #444;
        }
        
        .box-label {
              position: absolute;
              top: -0.8em;
              left: 1rem;
              background: white;
              padding: 0 0.5em;
              font-weight: bold;
              color: #444;
        }

        .hidden-input {
          display: none;
        }

        .icon-img {
            width: 24px;
            height: 24px;
            margin: 1px;
        }

        .pressed-icon {
            display: none;
        }

        /* Show pressed icon on click/press */
        .icon-label:active .default-icon {
            display: none;
        }

        .icon-label:active .pressed-icon {
            display: inline;
        }

        .button-icon-with-text{
            display: flex;
        }

        .button-icon-with-text-label{
            margin: 2px;
            align-content: center;
        }

        .truncate-label {
            display: inline-block;      /* Or block */
            width: 300px;               /* Set a fixed width */
            white-space: nowrap;        /* Prevent wrapping */
            overflow: hidden;           /* Hide overflow */
            text-overflow: ellipsis;    /* Add ... at the end */
        }

        .range-values {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: #666;
        }

    </style>
</head>
<body>
    <div id="timeline">
        <label class="icon-label" for="prev-frame">
            <img src="icons/chevron-left-circle-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
            <img src="icons/chevron-left-circle-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
        </label>
        <button onclick="prevFrame()" id="prev-frame" class="hidden-input"></button>
        <label class="icon-label" for="next-frame">
            <img src="icons/chevron-right-circle-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
            <img src="icons/chevron-right-circle-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
        </label>
        <button onclick="nextFrame()" id="next-frame" class="hidden-input"></button>
        <label class="icon-label" for="play-animation">
            <img src="icons/play-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
            <img src="icons/play-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
        </label>
        <button onclick="playAnimation()" id="play-animation" class="hidden-input"></button>
        <label class="icon-label" for="export-animation">
            <img src="icons/save-floppy-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
            <img src="icons/save-floppy-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
        </label>
        <button onclick="exportAnimation()" id="export-animation" class="hidden-input"></button>
        <div id="frame-thumbnails"></div>
    </div>

    <div id="container">
        <div id="sidebar">
            <div class="box-wrapper">
                <span class="box-label">Layout Controls</span>
                <div class="button-icon-with-text">
                    <label class="icon-label" for="layout-file">
                        <img src="icons/plus-circle-svgrepo-com.svg" alt="Upload" class="icon-img default-icon" />
                        <img src="icons/plus-circle-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                    </label>
                    <input title="load layout" type="file" id="layout-file" class="hidden-input" accept=".json" onchange="loadLedsConfig(event)"/>
                    <label id="layout-file-name" class="button-icon-with-text-label truncate-label">Load Layout</label>
                </div>
            </div>
            <div class="box-wrapper">
                <span class="box-label">Animation Controls</span>
                <div class="button-icon-with-text">
                    <label class="icon-label" for="animation-file">
                        <img src="icons/plus-circle-svgrepo-com.svg" alt="Upload" class="icon-img default-icon" />
                        <img src="icons/plus-circle-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                    </label>
                    <input title="load animation" type="file" id="animation-file" class="hidden-input" accept=".json" onchange="loadAnimationFromFile(event)"/>
                    <label class="button-icon-with-text-label">Load Animation</label>
                </div>
                <label class="icon-label" for="del-animation">
                    <img src="icons/trash-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                    <img src="icons/trash-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                </label>
                <button onclick="deleteAnimation()" id="del-animation" class="hidden-input"></button>
                <div id="animation-list"></div>
            </div>
        </div>
        <div id="canvas-container">
            <div>
                <canvas id="ledCanvas" width="800" height="600"></canvas>
            </div>
            
            <div class="spectrum-display">
                <canvas width="20" height="170" id="spectrum-axis-y" class="spectrum_axis"></canvas>
                <canvas width="775" height="170 " id="spectrum-canvas"></canvas>
                <canvas style="margin-left: 25px;" width="790" height="10" id="spectrum-axis-x" class="spectrum_axis"></canvas>  
            </div>

            <div class="spectrum-controls">
                <div class="control-group">
                    <label>Frequency Range (Hz):</label>
                    <div class="dual-range-container">
                        <div class="dual-range">
                            <input type="range" id="spectrum-min-freq" min="0" max="1024" value="0" step="1">
                            <input type="range" id="spectrum-max-freq" min="0" max="1024" value="1024" step="1">
                            <div class="range-track"></div>
                        </div>
                        <div class="range-values">
                            <span id="min-freq-value">0</span>
                            <span id="max-freq-value">1024</span>
                        </div>
                    </div>
                </div>
            
                <div class="control-group">
                    <label>Level Range:</label>
                        <div class="dual-range-container">
                        <div class="dual-range">
                            <input type="range" id="spectrum-min-level" min="0" max="255" value="0" step="1">
                            <input type="range" id="spectrum-max-level" min="0" max="255" value="255" step="1">
                            <div class="range-track"></div>
                        </div>
                        <div class="range-values">
                            <span id="min-level-value">0</span>
                            <span id="max-level-value">255</span>
                        </div>
                    </div>
                </div>
            </div>

            <style>
                .spectrum-controls {
                    margin: 20px 0;
                    display: flex;
                    flex-direction: row;
                    gap: 10px;
                }
                
                .control-group {
                    margin: 10px 0;
                }
                
                .dual-range-container {
                    display: flex;
                    flex-direction: column;
                    gap: 5px;
                    width: 100%;
                }
                
                .dual-range {
                    position: relative;
                    height: 20px;
                    width: 100%;
                }
                
                .dual-range input[type="range"] {
                    position: absolute;
                    width: 100%;
                    pointer-events: none;
                    -webkit-appearance: none;
                    background: transparent;
                }
                
                .dual-range input[type="range"]::-webkit-slider-thumb {
                    pointer-events: auto;
                    -webkit-appearance: none;
                    width: 16px;
                    height: 16px;
                    border-radius: 50%;
                    background: #4CAF50;
                    cursor: pointer;
                }
                
                .dual-range input[type="range"]::-moz-range-thumb {
                    pointer-events: auto;
                    width: 16px;
                    height: 16px;
                    border-radius: 50%;
                    background: #4CAF50;
                    cursor: pointer;
                }
                
                .range-track {
                    position: absolute;
                    height: 4px;
                    background: #ddd;
                    width: 100%;
                    top: 50%;
                    transform: translateY(-50%);
                    pointer-events: none;
                }
                
                .range-values {
                    display: flex;
                    justify-content: space-between;
                    font-size: 0.9em;
                    color: #666;
                }
            </style>
        </div>
        <div id="audio-toolbar">
            <div class="box-wrapper">
                <span class="box-label">Audio Controls</span>
                <div class="button-icon-with-text">
                    <label class="icon-label" for="audioFile">
                        <img src="icons/plus-circle-svgrepo-com.svg" alt="Upload" class="icon-img default-icon" />
                        <img src="icons/plus-circle-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                    </label>
                    <input onchange="updateAudioFileName()" title="load audio file" type="file" id="audioFile" accept="audio/*" class="hidden-input"/>
                    <label class="button-icon-with-text-label truncate-label" id="audio-file-name">Load Audio File</label>
                </div>
                <audio id="audioElement" controls></audio>
            </div>

            
            <div id="controls">
                <div class="box-wrapper">
                    <div class="button-icon-with-text">
                        <label class="icon-label" for="save-effects">
                            <img src="icons/save-floppy-svgrepo-com.svg" alt="Save" class="icon-img default-icon" />
                            <img src="icons/save-floppy-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                        </label>
                        <button onclick="saveEffectsToFile()" id="save-effects" class="hidden-input"></button>
                        <label class="button-icon-with-text-label">Save Effects</label>
                    </div>

                    <div class="button-icon-with-text">
                        <label class="icon-label" for="load-effects">
                            <img src="icons/plus-circle-svgrepo-com.svg" alt="Load" class="icon-img default-icon" />
                            <img src="icons/plus-circle-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                        </label>
                        <input onchange="loadEffectsFromFile(event)" type="file" id="load-effects" accept=".json" class="hidden-input"/>
                        <label class="button-icon-with-text-label">Load Effects</label>
                    </div>
                </div>
                <div id="effect-control">
                    <div class="box-wrapper">
                        <div class="box-label">Animation:</div>
                        <select class="select-input" id="effect-anim"></select>
                        <select class="select-input" id="effect-type">
                            <option>Pulse</option>
                            <option>Animation</option>
                        </select>
                        <label style="float: right;" class="icon-label" for="update-effect">
                            <img src="icons/refresh-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                            <img src="icons/refresh-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                        </label>
                        <button onclick="updateEffect()" id="update-effect" class="hidden-input"></button>
                        <label style="float: right;" class="icon-label" for="add-effect">
                            <img src="icons/plus-circle-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                            <img src="icons/plus-circle-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                        </label>
                        <button onclick="addEffect()" id="add-effect" class="hidden-input"></button>
                        <label style="float: right;" class="icon-label" for="del-effect">
                            <img src="icons/trash-svgrepo-com.svg" alt="Default" class="icon-img default-icon" />
                            <img src="icons/trash-svgrepo-com_pressed.svg" alt="Pressed" class="icon-img pressed-icon" />
                        </label>
                        <button onclick="deleteEffect()" id="del-effect" class="hidden-input"></button>
                        <div class="box-wrapper">
                            <div class="box-label">Frequency range:</div>
                            <label>Hz Min: </label><input style="width: 50px;" type="number" id="effect-Hz-min-range">
                            <label>Hz Max: </label><input style="width: 50px;" type="number" id="effect-Hz-max-range">
                        </div>
                        <div class="pulse-control box-wrapper">
                            <div class="box-label">level range:</div>
                            <label>Min: </label><input style="width: 50px;" type="number" id="effect-min-range">
                            <label>Max: </label><input style="width: 50px;" type="number" id="effect-max-range">
                        </div>
                        <div class="anim-control box-wrapper" style="display: none;">
                            <div class="box-label">Threshold:</div>
                            <input style="width: 50px;" type="number" id="effect-threshold">
                        </div>
                        <div>
                            <div id="effect-list"></div>
                        </div>
                    </div>
                    
                </div>
                
            </div>
        </div>
    </div>
    
    <script src="led_common.js"></script>
    <script src="audio_modulator.js"></script>
    <script src="audio_spectrum.js"></script>
    <script src="led_audio_editor.js"></script>
   
</body>
</html>
