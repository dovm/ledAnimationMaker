<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio LED Effects</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        canvas { border: 1px solid black; display: block; margin: 10px auto; }
        .controls { margin: 10px; }
    </style>
</head>
<body>
    <h1>Audio LED Effects</h1>
    <div class="controls">
        <input type="file" id="audioInput" accept="audio/*">
        <select id="effectSelect">
            <option value="pulse">Pulse Effect</option>
        </select>
        <button onclick="applyEffect()">Apply Effect</button>
    </div>
    
    <div class="controls">
        <label>LED Group:</label>
        <select id="groupSelect"></select>
        <input type="color" id="groupColor" value="#ff0000">
        <button onclick="updateGroupColor()">Update Color</button>
    </div>
    
    <canvas id="ledCanvas" width="600" height="200"></canvas>

    <script>
        class AudioLedController {
            constructor(canvas) {
                this.canvas = canvas;
                this.ledGroups = [];
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.analyser = this.audioContext.createAnalyser();
                this.source = null;
                this.effects = [];
            }

            loadAudio(file) {
                const reader = new FileReader();
                reader.onload = async (event) => {
                    const arrayBuffer = event.target.result;
                    const audioBuffer = await this.audioContext.decodeAudioData(arrayBuffer);
                    if (this.source) this.source.stop();
                    this.source = this.audioContext.createBufferSource();
                    this.source.buffer = audioBuffer;
                    this.source.connect(this.analyser);
                    this.analyser.connect(this.audioContext.destination);
                    this.source.start();
                    this.processAudio();
                };
                reader.readAsArrayBuffer(file);
            }

            addEffect(effect) {
                this.effects.push(effect);
            }

            processAudio() {
                const bufferLength = this.analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                
                const render = () => {
                    requestAnimationFrame(render);
                    this.analyser.getByteFrequencyData(dataArray);
                    this.applyEffects(dataArray);
                };
                render();
            }

            applyEffects(audioData) {
                this.effects.forEach(effect => effect.apply(audioData, this.ledGroups));
                this.renderLeds();
            }

            renderLeds() {
                const ctx = this.canvas.getContext('2d');
                ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.ledGroups.forEach(group => {
                    group.leds.forEach(led => {
                        ctx.fillStyle = `rgb(${led.color[0]}, ${led.color[1]}, ${led.color[2]})`;
                        ctx.fillRect(led.x, led.y, 10, 10);
                    });
                });
            }
        }

        class PulseEffect {
            constructor(intensityThreshold, colorRange) {
                this.intensityThreshold = intensityThreshold;
                this.colorRange = colorRange;
            }

            apply(audioData, ledGroups) {
                const avgVolume = audioData.reduce((a, b) => a + b) / audioData.length;
                ledGroups.forEach(group => {
                    const brightness = Math.min(255, (avgVolume / this.intensityThreshold) * 255);
                    group.leds.forEach(led => {
                        led.color = [brightness, this.colorRange[1], this.colorRange[2]];
                    });
                });
            }
        }

        const canvas = document.getElementById('ledCanvas');
        const audioController = new AudioLedController(canvas);
        
        function createLedGroup(name, count, color) {
            const group = {
                name,
                leds: Array.from({ length: count }, (_, i) => ({ x: i * 30, y: 100, color: color }))
            };
            audioController.ledGroups.push(group);
            updateGroupList();
        }

        function updateGroupList() {
            const groupSelect = document.getElementById('groupSelect');
            groupSelect.innerHTML = '';
            audioController.ledGroups.forEach((group, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = group.name;
                groupSelect.appendChild(option);
            });
        }

        function updateGroupColor() {
            const selectedIndex = document.getElementById('groupSelect').value;
            const color = document.getElementById('groupColor').value;
            if (selectedIndex !== "" && audioController.ledGroups[selectedIndex]) {
                const rgb = hexToRgb(color);
                audioController.ledGroups[selectedIndex].leds.forEach(led => led.color = [rgb.r, rgb.g, rgb.b]);
                audioController.renderLeds();
            }
        }

        function hexToRgb(hex) {
            const bigint = parseInt(hex.substring(1), 16);
            return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
        }

        document.getElementById('audioInput').addEventListener('change', (event) => {
            audioController.loadAudio(event.target.files[0]);
        });

        function applyEffect() {
            const effectType = document.getElementById('effectSelect').value;
            if (effectType === 'pulse') {
                audioController.addEffect(new PulseEffect(100, [255, 0, 0]));
            }
        }

        createLedGroup("Group 1", 20, [255, 0, 0]);
    </script>
</body>
</html>
